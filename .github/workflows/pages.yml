name: Website

# Builds website/ with Vite and publishes it to GitHub Pages at https://vic663.github.io/nuagent/.
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The site is served from https://vic663.github.io/nuagent/, so every asset URL needs that prefix.
      # `npm run build` alone stays root-based for local preview and for hosts like Vercel.
      - run: npm run build:pages
      # GitHub Pages has no SPA rewrite rule. Serving index.html as the 404 page lets a deep link
      # such as /nuagent/Results load the app, which then routes client-side.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
