task: >
  Compute the transient tritium permeation flux through a 1 mm tungsten membrane at 600 K with an upstream
  concentration of 1e20 m^-3 and verify the steady flux and time lag against the analytical solution.
spec:
  name: eval-tritium-permeation
  backend: mock
  case:
    kind: permeation
    material: {name: tungsten, D_0: 4.1e-7, E_D: 0.39}
    thickness: 1.0e-3
    temperature: 600.0
    upstream_concentration: 1.0e20
  validation:
    references:
      - {quantity: permeation_flux_ss, source: analytical, tolerance: 0.02}
      - {quantity: time_lag, source: analytical, tolerance: 0.05}
expect:
  max_attempts: 1
