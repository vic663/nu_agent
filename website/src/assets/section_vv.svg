  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g stroke="#bae6fd" stroke-opacity="0.8" stroke-width="2">
    <rect x="120" y="300" width="480" height="480" fill="url(#g1)"/>
    <rect x="720" y="300" width="480" height="480" fill="url(#g2)"/>
    <rect x="1320" y="300" width="480" height="480" fill="url(#g3)"/>
